name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify binary asset headers (PNG / JPG / WEBP / TTF)
        run: |
          python3 - <<'PY'
          import glob, sys
          checks = [
              ("*.png", b"\x89PNG\r\n\x1a\n"),
              ("*.jpg", b"\xff\xd8\xff"),
              ("*.webp", b"RIFF"),
              ("*.ttf", b"\x00\x01\x00\x00"),
          ]
          bad = []
          for pattern, magic in checks:
              for path in glob.glob(f"app/src/**/{pattern}", recursive=True):
                  with open(path, "rb") as f:
                      if not f.read(len(magic)).startswith(magic):
                          bad.append(path)
          if bad:
              print("Corrupted binary signatures:", bad)
              sys.exit(1)
          print("All binary headers verified.")
          PY

      - name: Guard against destructive Room fallback migrations
        run: |
          if grep -rn "fallbackToDestructiveMigration" app/src/main/; then
            echo "ERROR: fallbackToDestructiveMigration found in app/src/main/"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run offline unit & Robolectric tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.data.GeminiServiceTest" \
            --tests "com.example.data.crypto.CryptoHelperTest" \
            --tests "com.example.data.security.EncryptedMessageSecurityTest" \
            --tests "com.example.data.security.PinSecurityTest" \
            --tests "com.example.data.NftMintingServiceTest" \
            --tests "com.example.data.AuditSecurityRegressionsTest" \
            --tests "com.example.data.Bip39Test" \
            --tests "com.example.data.DeckIntegrityTest" \
            --tests "com.example.TarotReadingTest" \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.ui.components.WeedGuruTarotCardTest"

      - name: Run Release Android Lint & Debug APK Build
        run: |
          gradle :app:lintRelease :app:assembleDebug
